<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Siege — 2D Shooter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gameContainer">
  <canvas id="game" width="900" height="600"></canvas>

  <div id="hud">
    <div class="panel">
      <div>❤ Health</div>
      <div id="healthBarWrap"><div id="healthBar"></div></div>
      <div id="ammoText">Ammo: 12 / 12</div>
    </div>
    <div class="panel" style="text-align:right;">
      <div id="waveText">Wave 1</div>
      <div>Score: <span id="scoreText">0</span></div>
      <div>Zombies left: <span id="zombiesLeft">0</span></div>
    </div>
  </div>

  <div id="reloadMsg" class="hidden">RELOADING...</div>

  <div id="overlay">
    <h1>ZOMBIE SIEGE</h1>
    <p>WASD / Arrow keys to move. Mouse to aim. Click (or hold) to shoot. Press R to reload.</p>
    <p>Survive escalating waves of zombies. Don't let them touch you too many times.</p>
    <button id="startBtn">Start Game</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
